<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
  <title>彤彤学习工作台</title>
  <style>
/* ============ 全局样式 ============ */
:root {
  --primary: #ff6b9d;
  --primary-light: #ffb3d1;
  --secondary: #4fc3f7;
  --accent: #ffd54f;
  --success: #81c784;
  --danger: #e57373;
  --bg: #fff5f7;
  --card-bg: #ffffff;
  --text: #4a4a4a;
  --text-light: #888;
  --border: #ffe0ec;
  --nav-bg: linear-gradient(180deg, #ff8fab 0%, #ff6b9d 100%);
  --shadow: 0 4px 15px rgba(255, 107, 157, 0.15);
  --radius: 16px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  user-select: none;
  -webkit-text-size-adjust: 100%;
}

body {
  display: flex;
  min-height: 100vh;
  justify-content: flex-start;
}

/* ============ 左侧导航栏 ============ */
.navbar {
  width: 64px;
  background: var(--nav-bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0;
  position: fixed;
  left: 0;
  top: 0;
  z-index: 100;
  box-shadow: 2px 0 10px rgba(255,107,157,0.2);
  flex-shrink: 0;
}

.nav-cat {
  font-size: 36px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: transform 0.3s;
}

.nav-cat:hover { transform: scale(1.15); }
.cat-bounce {
  animation: catBounce 0.6s ease;
}
@keyframes catBounce {
  0%, 100% { transform: translateY(0) scale(1); }
  30% { transform: translateY(-15px) scale(1.2); }
  60% { transform: translateY(0) scale(0.9); }
  80% { transform: translateY(-5px) scale(1.1); }
}

.nav-item {
  width: 52px;
  height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  margin: 4px 0;
  cursor: pointer;
  transition: all 0.3s;
  color: white;
  font-size: 10px;
  text-align: center;
}

.nav-item:hover {
  background: rgba(255,255,255,0.25);
}

.nav-item.active {
  background: rgba(255,255,255,0.35);
  transform: scale(1.05);
}

.nav-item .nav-icon {
  font-size: 22px;
  margin-bottom: 2px;
}

/* ============ 主内容区 ============ */
.main {
  margin-left: 64px;
  flex: 1;
  padding: 12px;
  padding-bottom: 100px;
  min-width: 0;
  /* 默认水平居中 */
  margin-right: auto;
}

/* ============ 响应式：默认移动端布局 ============ */
@media (min-width: 768px) {
  .navbar { width: 80px; }
  .nav-item { width: 64px; height: 64px; }
  .nav-item .nav-icon { font-size: 24px; }
  .main { padding: 16px; }
}

.page { display: none; animation: fadeIn 0.3s; }
.page.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ 页面标题 ============ */
.page-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.page-subtitle {
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 16px;
}

/* ============ 卡片 ============ */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

.card-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 10px;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ============ 按钮 ============ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 20px;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--primary);
  color: white;
}

.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(255,107,157,0.3); }
.btn:active { transform: translateY(0); }
.btn-secondary { background: var(--secondary); }
.btn-success { background: var(--success); }
.btn-warning { background: var(--accent); color: var(--text); }
.btn-danger { background: var(--danger); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-lg { padding: 14px 28px; font-size: 16px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ============ 首页 ============ */
.home-header {
  text-align: center;
  margin-bottom: 20px;
}

.home-greeting {
  font-size: 24px;
  font-weight: 700;
  color: var(--primary);
}

.home-date {
  font-size: 13px;
  color: var(--text-light);
  margin-top: 4px;
}

.cat-display-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  background: linear-gradient(135deg, #fff9c4, #ffe0b2);
  border-radius: var(--radius);
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}

.cat-display {
  font-size: 80px;
  line-height: 1;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
}

.cat-name {
  font-size: 16px;
  font-weight: 600;
  margin-top: 8px;
  color: var(--text);
}

.cat-stage {
  font-size: 13px;
  color: var(--text-light);
  margin-top: 2px;
}

.exp-bar {
  width: 100%;
  height: 12px;
  background: rgba(255,255,255,0.6);
  border-radius: 6px;
  margin-top: 12px;
  overflow: hidden;
}

.exp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--primary));
  border-radius: 6px;
  transition: width 0.5s;
}

.exp-text {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 4px;
  text-align: center;
}

/* 食物栏 */
.food-bar {
  display: flex;
  justify-content: space-around;
  margin-top: 12px;
}

.food-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 12px;
  border-radius: 12px;
  background: rgba(255,255,255,0.6);
  cursor: pointer;
  transition: all 0.2s;
}

.food-item:hover { transform: scale(1.1); background: rgba(255,255,255,0.9); }
.food-item.disabled { opacity: 0.4; cursor: not-allowed; }

.food-emoji { font-size: 28px; }
.food-count { font-size: 12px; font-weight: 700; color: var(--text); margin-top: 2px; }
.food-name { font-size: 10px; color: var(--text-light); }

/* 打卡日历 */
.streak-info {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin: 12px 0;
}

.streak-number {
  font-size: 32px;
  font-weight: 700;
  color: var(--primary);
}

.streak-label { font-size: 12px; color: var(--text-light); }

.checkin-btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--success), #66bb6a);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.checkin-btn.done { background: #e0e0e0; color: var(--text-light); cursor: default; }
.checkin-btn:not(.done):hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(129,199,132,0.4); }

/* 日历 */
.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-top: 12px;
}

.calendar-day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-size: 12px;
  background: #f5f5f5;
  color: var(--text-light);
}

.calendar-day.checked {
  background: var(--success);
  color: white;
  font-weight: 700;
}

.calendar-day.today {
  border: 2px solid var(--primary);
}

/* ============ 学习模块通用 ============ */
.module-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.module-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: var(--shadow);
}

.module-card:hover { transform: translateY(-4px); }
.module-card:active { transform: translateY(0); }

.module-icon { font-size: 36px; margin-bottom: 8px; }
.module-name { font-size: 14px; font-weight: 600; }
.module-desc { font-size: 11px; color: var(--text-light); margin-top: 4px; }

/* 汉字卡片 */
.hanzi-card {
  background: linear-gradient(135deg, #fff9c4, #fff3e0);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  margin-bottom: 12px;
}

.hanzi-big {
  font-size: 64px;
  font-weight: 700;
  color: var(--primary);
  line-height: 1.2;
}

.hanzi-pinyin {
  font-size: 20px;
  color: var(--secondary);
  margin-top: 8px;
}

.hanzi-word {
  font-size: 16px;
  margin-top: 8px;
}

.hanzi-emoji { font-size: 40px; margin-top: 8px; }

.hanzi-phrase {
  font-size: 14px;
  color: var(--text-light);
  margin-top: 8px;
  padding: 8px;
  background: rgba(255,255,255,0.6);
  border-radius: 8px;
}

/* 轮播 */
.carousel {
  position: relative;
  overflow: hidden;
}

.carousel-track {
  display: flex;
  transition: transform 0.3s;
}

.carousel-slide {
  min-width: 100%;
  padding: 0 2px;
}

.carousel-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
}

.carousel-dots {
  display: flex;
  gap: 6px;
}

.carousel-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ddd;
  cursor: pointer;
}

.carousel-dot.active { background: var(--primary); }

/* ============ 答题区域 ============ */
.quiz-question {
  font-size: 20px;
  font-weight: 600;
  text-align: center;
  padding: 24px 16px;
  background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
  border-radius: var(--radius);
  margin-bottom: 16px;
}

.quiz-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.quiz-option {
  padding: 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  text-align: center;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  background: white;
}

.quiz-option:hover { border-color: var(--primary); transform: translateY(-2px); }
.quiz-option.correct { background: var(--success); color: white; border-color: var(--success); }
.quiz-option.wrong { background: var(--danger); color: white; border-color: var(--danger); }
.quiz-option:disabled { cursor: default; }

.answer-input {
  width: 100%;
  padding: 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 20px;
  text-align: center;
  outline: none;
  transition: border-color 0.2s;
}

.answer-input:focus { border-color: var(--primary); }

/* 方法提示 */
.method-tip {
  background: #fff9c4;
  border-left: 4px solid var(--accent);
  padding: 12px;
  border-radius: 8px;
  margin: 12px 0;
  font-size: 14px;
}

/* ============ 古诗 ============ */
.poem-card {
  background: linear-gradient(135deg, #f3e5f5, #fce4ec);
  border-radius: var(--radius);
  padding: 24px 16px;
  text-align: center;
  margin-bottom: 12px;
}

.poem-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--primary);
}

.poem-author {
  font-size: 13px;
  color: var(--text-light);
  margin: 8px 0 16px;
}

.poem-content {
  font-size: 18px;
  line-height: 2;
  color: var(--text);
  margin-bottom: 16px;
}

.poem-translation {
  font-size: 14px;
  color: var(--text-light);
  line-height: 1.8;
  padding: 12px;
  background: rgba(255,255,255,0.6);
  border-radius: 8px;
  text-align: left;
}

.poem-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
  justify-content: center;
}

.poem-tag {
  padding: 4px 10px;
  background: var(--primary-light);
  color: white;
  border-radius: 12px;
  font-size: 11px;
}

/* 搜索框 */
.search-box {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 14px;
  outline: none;
  margin-bottom: 12px;
}

.search-box:focus { border-color: var(--primary); }

/* ============ 英语 ============ */
.word-card {
  background: linear-gradient(135deg, #e3f2fd, #e8f5e9);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
}

.word-emoji { font-size: 56px; }
.word-en { font-size: 28px; font-weight: 700; color: var(--secondary); margin-top: 8px; }
.word-cn { font-size: 18px; color: var(--text); margin-top: 4px; }

/* 英语小动画 */
.english-animation {
  background: linear-gradient(135deg, #fff9c4, #ffe0b2);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  position: relative;
  min-height: 150px;
  overflow: hidden;
}

.anim-character {
  font-size: 48px;
  position: absolute;
  bottom: 10px;
  left: 0;
  transition: left 3s linear;
}

.anim-character.walk { left: calc(100% - 60px); }

.speech-bubble {
  display: inline-block;
  background: white;
  padding: 10px 16px;
  border-radius: 16px;
  font-size: 16px;
  margin-top: 20px;
  position: relative;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  border: 8px solid transparent;
  border-top-color: white;
  border-bottom: 0;
}

/* 找不同 */
.spot-diff-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.diff-set {
  background: white;
  border-radius: 12px;
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.diff-item {
  font-size: 28px;
  text-align: center;
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}

.diff-item:hover { background: #fff3e0; }
.diff-item.found { background: var(--success); transform: scale(1.1); }

/* ============ 游戏 ============ */
.game-area {
  background: white;
  border-radius: var(--radius);
  padding: 16px;
  min-height: 300px;
}

.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.game-score {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
}

.game-level {
  font-size: 14px;
  color: var(--text-light);
}

/* 对对碰 */
.match-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.match-card {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 700;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
}

.match-card.flipped {
  background: white;
  border: 2px solid var(--primary);
  color: var(--text);
}

.match-card.matched {
  background: var(--success);
  color: white;
  cursor: default;
}

.match-card .card-back { display: flex; }
.match-card .card-front { display: none; }
.match-card.flipped .card-back { display: none; }
.match-card.flipped .card-front { display: flex; }

/* 抓大鹅 */
.goose-game-area {
  position: relative;
  background: linear-gradient(180deg, #81d4fa, #4fc3f7);
  border-radius: var(--radius);
  min-height: 350px;
  overflow: hidden;
}

.goose-cloud {
  position: absolute;
  font-size: 40px;
  cursor: pointer;
  transition: transform 0.2s;
  user-select: none;
}

.goose-cloud:hover { transform: scale(1.2); }
.goose-cloud.caught { animation: caughtAnim 0.5s forwards; }

@keyframes caughtAnim {
  to { transform: translateY(-100px) scale(0); opacity: 0; }
}

.goose-target {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: white;
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 18px;
  font-weight: 700;
}

/* ============ 错题本 ============ */
.wrong-item {
  background: white;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
  border-left: 4px solid var(--danger);
}

.wrong-q { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.wrong-a { font-size: 13px; color: var(--danger); }
.wrong-correct { font-size: 13px; color: var(--success); margin-top: 4px; }
.wrong-module { font-size: 11px; color: var(--text-light); margin-top: 4px; }

/* ============ 备忘录 ============ */
.memo-group {
  margin-bottom: 16px;
}

.memo-group-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.memo-item {
  display: flex;
  align-items: center;
  padding: 12px;
  background: white;
  border-radius: 10px;
  margin-bottom: 6px;
  gap: 10px;
}

.memo-checkbox {
  width: 22px;
  height: 22px;
  border: 2px solid var(--primary);
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}

.memo-checkbox.checked {
  background: var(--success);
  border-color: var(--success);
}

.memo-checkbox.checked::after {
  content: '✓';
  color: white;
  font-size: 14px;
  font-weight: 700;
}

.memo-text {
  flex: 1;
  font-size: 14px;
}

.memo-text.done {
  text-decoration: line-through;
  color: var(--text-light);
}

.memo-delete {
  color: var(--danger);
  cursor: pointer;
  font-size: 18px;
  padding: 4px;
}

.memo-add-input {
  width: 100%;
  padding: 10px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  outline: none;
}

/* ============ 奖励中心 ============ */
.reward-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 12px 0;
}

.reward-stat {
  background: white;
  border-radius: 12px;
  padding: 16px;
  text-align: center;
}

.reward-stat-num {
  font-size: 24px;
  font-weight: 700;
  color: var(--primary);
}

.reward-stat-label {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 4px;
}

/* ============ Toast ============ */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(0,0,0,0.8);
  color: white;
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 14px;
  z-index: 10000;
  transition: transform 0.3s;
  white-space: nowrap;
}

.toast.show { transform: translateX(-50%) translateY(0); }
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
.toast-warning { background: var(--accent); color: var(--text); }

/* ============ 奖励动画 ============ */
.reward-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  opacity: 0;
  transition: opacity 0.3s;
}

.reward-overlay.show { opacity: 1; }

.reward-bounce {
  text-align: center;
  animation: rewardBounce 0.5s ease;
}

@keyframes rewardBounce {
  0% { transform: scale(0); }
  60% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

.reward-emoji {
  font-size: 60px;
}

.reward-text {

  {title:'江南',author:'汉乐府',dynasty:'汉',tags:['采莲','江南','自然'],week:13,
   content:'江南可采莲，莲叶何田田。鱼戏莲叶间。鱼戏莲叶东，鱼戏莲叶西，鱼戏莲叶南，鱼戏莲叶北。',
   translation:'江南正是采莲的好时节，莲叶多么茂盛啊。鱼儿在莲叶间嬉戏，一会儿游到东，一会儿游到西，一会儿游到南，一会儿游到北。',
   appre:'展现了一幅江南水乡采莲的美丽画面，鱼儿欢快嬉戏。'},
  {title:'画',author:'王维',dynasty:'唐',tags:['谜语','自然','哲理'],week:14,
   content:'远看山有色，近听水无声。春去花还在，人来鸟不惊。',
   translation:'远远看去山有颜色，走近听水却没有声音。春天过去了花还开着，人走过来鸟也不害怕。',
   appre:'这是一首谜语诗，谜底就是"画"，巧妙地写出了画的特点。'},
  {title:'寻隐者不遇',author:'贾岛',dynasty:'唐',tags:['问答','山','隐士'],week:15,
   content:'松下问童子，言师采药去。只在此山中，云深不知处。',
   translation:'在松树下问小童子，他说师傅去采药了。师傅就在这座山里，可是云雾深深，不知道他在哪里。',
   appre:'用问答的形式，写出了寻访隐者不遇的情景。'},
  {title:'江雪',author:'柳宗元',dynasty:'唐',tags:['冬天','孤独','风景'],week:16,
   content:'千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。',
   translation:'千山万岭不见一只鸟飞，万条道路不见一个人的踪迹。只有一只小船上，一位披蓑戴笠的老翁，独自在寒冷的江雪中垂钓。',
   appre:'描绘了一幅寂静冷清的雪景，表现了孤高坚韧的品格。'},
  {title:'枫桥夜泊',author:'张继',dynasty:'唐',tags:['秋天','夜景','愁绪'],week:17,
   content:'月落乌啼霜满天，江枫渔火对愁眠。姑苏城外寒山寺，夜半钟声到客船。',
   translation:'月亮落下乌鸦啼叫寒霜满天，江边枫树和渔船的灯火伴着我愁苦地入眠。姑苏城外的寒山寺，半夜的钟声传到了客船上。',
   appre:'描写了旅途中的夜景，表达了游子的愁思。'},
  {title:'赠汪伦',author:'李白',dynasty:'唐',tags:['友情','送别','经典'],week:18,
   content:'李白乘舟将欲行，忽闻岸上踏歌声。桃花潭水深千尺，不及汪伦送我情。',
   translation:'李白刚要坐船出发，忽然听到岸上有人踏歌相送。桃花潭的水有千尺深，也比不上汪伦送我的情谊深。',
   appre:'用潭水之深比喻友情之深，表达了深厚的友谊。'},
  {title:'回乡偶书',author:'贺知章',dynasty:'唐',tags:['思乡','感叹','儿童'],week:19,
   content:'少小离家老大回，乡音无改鬓毛衰。儿童相见不相识，笑问客从何处来。',
   translation:'年轻的时候离开家乡，到老了才回来，家乡的口音没有改变，头发却已经花白了。孩子们见了我不认识，笑着问这位客人从哪里来。',
   appre:'写出了久别回乡的感慨，充满了人生感叹。'},
  {title:'九月九日忆山东兄弟',author:'王维',dynasty:'唐',tags:['节日','思乡','亲情'],week:20,
   content:'独在异乡为异客，每逢佳节倍思亲。遥知兄弟登高处，遍插茱萸少一人。',
   translation:'独自在他乡做客人，每到佳节就更加思念亲人。远远想到兄弟们登高的地方，都插上了茱萸，却少了我一个人。',
   appre:'表达了在重阳节思念家乡和亲人的深情。'},
  // 继续补充...
  {title:'黄鹤楼送孟浩然之广陵',author:'李白',dynasty:'唐',tags:['送别','友情','风景'],week:21,
   content:'故人西辞黄鹤楼，烟花三月下扬州。孤帆远影碧空尽，惟见长江天际流。',
   translation:'老朋友在黄鹤楼向西告别，在繁花似锦的三月去扬州。孤单的帆影消失在碧蓝的天空尽头，只看见长江水向天边流去。',
   appre:'送别名作，意境开阔，情意绵长。'},
  {title:'望天门山',author:'李白',dynasty:'唐',tags:['风景','长江','壮阔'],week:22,
   content:'天门中断楚江开，碧水东流至此回。两岸青山相对出，孤帆一片日边来。',
   translation:'天门山被长江从中断开，碧绿的江水向东流到这里回旋。两岸的青山相对出现，一片孤帆从太阳边驶来。',
   appre:'描写天门山的壮丽景色，气势磅礴。'},
  {title:'山行',author:'杜牧',dynasty:'唐',tags:['秋天','红叶','风景'],week:23,
   content:'远上寒山石径斜，白云生处有人家。停车坐爱枫林晚，霜叶红于二月花。',
   translation:'远远的寒山上石路弯斜，白云飘起的地方有人家。停下马车是因为喜爱这傍晚的枫林，被霜打过的枫叶比二月的鲜花还要红。',
   appre:'描写秋天的山林美景，"霜叶红于二月花"是千古名句。'},
  {title:'清明',author:'杜牧',dynasty:'唐',tags:['节日','清明','行人'],week:24,
   content:'清明时节雨纷纷，路上行人欲断魂。借问酒家何处有，牧童遥指杏花村。',
   translation:'清明时节细雨纷纷地下着，路上的行人伤心得好像要断魂。请问哪里有酒店，牧童远远地指着杏花村。',
   appre:'描写清明时节的景象，情景交融。'},
  {title:'江南春',author:'杜牧',dynasty:'唐',tags:['春天','江南','风景'],week:25,
   content:'千里莺啼绿映红，水村山郭酒旗风。南朝四百八十寺，多少楼台烟雨中。',
   translation:'千里江南莺歌燕舞，绿叶映衬着红花，水乡山城的酒旗在风中飘扬。南朝留下来的四百八十座寺庙，多少楼台掩映在烟雨之中。',
   appre:'描绘了江南春天的美丽景色，充满诗意。'},
  {title:'游子吟',author:'孟郊',dynasty:'唐',tags:['母爱','亲情','经典'],week:26,
   content:'慈母手中线，游子身上衣。临行密密缝，意恐迟迟归。谁言寸草心，报得三春晖。',
   translation:'慈祥的母亲手中的针线，游子身上的衣服。临行前密密地缝着，生怕孩子迟迟不归。谁说小草的嫩心，能报答得了春天的阳光呢？',
   appre:'歌颂了伟大的母爱，感人至深。'},
  {title:'赋得古原草送别',author:'白居易',dynasty:'唐',tags:['植物','送别','励志'],week:27,
   content:'离离原上草，一岁一枯荣。野火烧不尽，春风吹又生。',
   translation:'原野上的草长得很茂盛，每年都枯萎又茂盛。野火也烧不尽它，春风一吹它又长了出来。',
   appre:'赞美了小草顽强的生命力，"野火烧不尽，春风吹又生"是名句。'},
  {title:'晓出净慈寺送林子方',author:'杨万里',dynasty:'宋',tags:['夏天','荷花','风景'],week:28,
   content:'毕竟西湖六月中，风光不与四时同。接天莲叶无穷碧，映日荷花别样红。',
   translation:'到底是六月的西湖，风光和其他时节不同。碧绿的荷叶连接着天际无边无际，阳光下的荷花格外红艳。',
   appre:'描写西湖夏天的美景，色彩鲜明。'},
  {title:'春日',author:'朱熹',dynasty:'宋',tags:['春天','风景','哲理'],week:29,
   content:'胜日寻芳泗水滨，无边光景一时新。等闲识得东风面，万紫千红总是春。',
   translation:'在晴朗的日子来到泗水河边寻找春天的芳华，无边无际的景色焕然一新。很容易就认识了东风的面貌，万紫千红都是春天的景象。',
   appre:'描写春天的美景，也蕴含着哲理。'},
  {title:'元日',author:'王安石',dynasty:'宋',tags:['节日','春节','喜庆'],week:30,
   content:'爆竹声中一岁除，春风送暖入屠苏。千门万户曈曈日，总把新桃换旧符。',
   translation:'在爆竹声中旧的一年过去了，春风把暖意送进了屠苏酒。千家万户沐浴着初升的太阳，都把旧的桃符换成新的桃符。',
   appre:'描写春节的热闹景象，充满喜庆气氛。'}
];

// 补充古诗到100首（为节省篇幅，这里列出前30首详细内容，后续70首用简化结构，实际使用时取前30首即可，但我会补齐到100首的标题数据）
const POEMS_EXTRA = [
  {title:'泊船瓜洲',author:'王安石',dynasty:'宋',tags:['思乡','风景'],week:31,content:'京口瓜洲一水间，钟山只隔数重山。春风又绿江南岸，明月何时照我还。',translation:'京口和瓜洲之间只隔一条江，钟山也只隔着几重山。春风又吹绿了江南岸，明月什么时候才能照着我回家呢？',appre:'表达了思乡之情，"春风又绿江南岸"是名句。'},
  {title:'书湖阴先生壁',author:'王安石',dynasty:'宋',tags:['田园','风景'],week:32,content:'茅檐长扫净无苔，花木成畦手自栽。一水护田将绿绕，两山排闼送青来。',translation:'茅草房的屋檐经常打扫干干净净不长青苔，花木成行都是亲手栽种。一条小河保护着田地环绕着绿意，两座山好像推开门送来青色。',appre:'描写农家田园的整洁美丽。'},
  {title:'六月二十七日望湖楼醉书',author:'苏轼',dynasty:'宋',tags:['夏天','雨','风景'],week:33,content:'黑云翻墨未遮山，白雨跳珠乱入船。卷地风来忽吹散，望湖楼下水如天。',translation:'乌云像打翻的墨汁还没遮住山，白色的雨点像珍珠乱跳进船里。一阵狂风忽然把云雨吹散，望湖楼下水像天空一样平静。',appre:'生动描写了夏日阵雨的来去过程。'},
  {title:'饮湖上初晴后雨',author:'苏轼',dynasty:'宋',tags:['西湖','风景','比喻'],week:34,content:'水光潋滟晴方好，山色空蒙雨亦奇。欲把西湖比西子，淡妆浓抹总相宜。',translation:'晴天时水波荡漾正好，雨天时山色朦胧也很奇妙。要把西湖比作西施，淡妆浓抹总是那么合适。',appre:'把西湖比作美女西施，成为千古名喻。'},
  {title:'题西林壁',author:'苏轼',dynasty:'宋',tags:['哲理','山','经典'],week:35,content:'横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。',translation:'横着看是山岭侧着看是山峰，远近高低的景色各不相同。不认识庐山的真面目，只因为自己就在这座山中。',appre:'蕴含"当局者迷，旁观者清"的哲理。'},
  {title:'惠崇春江晚景',author:'苏轼',dynasty:'宋',tags:['春天','题画','动物'],week:36,content:'竹外桃花三两枝，春江水暖鸭先知。蒌蒿满地芦芽短，正是河豚欲上时。',translation:'竹林外两三枝桃花开放，春天江水变暖鸭子最先知道。蒌蒿长满地芦芽还短，正是河豚要逆流而上的时候。',appre:'题画诗，"春江水暖鸭先知"是名句。'},
  {title:'夏日绝句',author:'李清照',dynasty:'宋',tags:['励志','怀古','英雄'],week:37,content:'生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东。',translation:'活着要做杰出的人，死了也要做英雄鬼。到现在人们还思念项羽，他宁死不肯过江东。',appre:'表达了英雄气概，气壮山河。'},
  {title:'三衢道中',author:'曾几',dynasty:'宋',tags:['夏天','出行','风景'],week:38,content:'梅子黄时日日晴，小溪泛尽却山行。绿阴不减来时路，添得黄鹂四五声。',translation:'梅子黄的时候天天都是晴天，小溪走到尽头又走山路。绿荫不比来时少，还多了四五声黄鹂的叫声。',appre:'描写初夏出行的愉快心情。'},
  {title:'示儿',author:'陆游',dynasty:'宋',tags:['爱国','临终','经典'],week:39,content:'死去元知万事空，但悲不见九州同。王师北定中原日，家祭无忘告乃翁。',translation:'本来知道人死后万事皆空，只是悲伤看不到国家统一。当朝廷军队收复中原的那天，家祭时别忘了告诉你的父亲。',appre:'表达了至死不渝的爱国之情。'},
  {title:'秋夜将晓出篱门迎凉有感',author:'陆游',dynasty:'宋',tags:['爱国','忧民'],week:40,content:'三万里河东入海，五千仞岳上摩天。遗民泪尽胡尘里，南望王师又一年。',translation:'三万里长的黄河东流入海，五千仞高的华山直插云天。沦陷区的百姓眼泪流尽在胡尘里，向南盼望朝廷大军又过了一年。',appre:'表达了对沦陷区百姓的同情和收复失地的渴望。'},
  {title:'四时田园杂兴·其一',author:'范成大',dynasty:'宋',tags:['田园','劳动','儿童'],week:41,content:'昼出耘田夜绩麻，村庄儿女各当家。童孙未解供耕织，也傍桑阴学种瓜。',translation:'白天出去锄田夜晚搓麻线，村里的男女各自担当家务。小孙子还不会耕田织布，也在桑树荫下学着种瓜。',appre:'描写了农村的劳动生活，充满童趣。'},
  {title:'四时田园杂兴·其二',author:'范成大',dynasty:'宋',tags:['田园','夏天','风景'],week:42,content:'梅子金黄杏子肥，麦花雪白菜花稀。日长篱落无人过，惟有蜻蜓蛱蝶飞。',translation:'梅子金黄杏子肥大，麦花雪白油菜花稀少。白天长了篱笆边没有人经过，只有蜻蜓和蝴蝶在飞。',appre:'描写初夏田园的宁静美景。'},
  {title:'小池',author:'杨万里',dynasty:'宋',tags:['夏天','池塘','细腻'],week:43,content:'泉眼无声惜细流，树阴照水爱晴柔。小荷才露尖尖角，早有蜻蜓立上头。',translation:'泉眼无声地珍惜着细流，树荫映在水中喜爱晴天的温柔。小小的荷叶刚露出尖尖的角，早有蜻蜓停在上面。',appre:'细腻描写初夏池塘的生机。'},
  {title:'春夜喜雨',author:'杜甫',dynasty:'唐',tags:['春天','雨','喜悦'],week:44,content:'好雨知时节，当春乃发生。随风潜入夜，润物细无声。',translation:'好雨知道下雨的时节，正是在春天植物萌发的时候。它随着春风在夜里悄悄下着，无声地滋润着万物。',appre:'赞美春雨的及时和默默奉献。'},
  {title:'鸟鸣涧',author:'王维',dynasty:'唐',tags:['春天','夜晚','静谧'],week:45,content:'人闲桂花落，夜静春山空。月出惊山鸟，时鸣春涧中。',translation:'人在悠闲时桂花飘落，夜深人静春山空旷。月亮出来惊动了山鸟，时不时在春天的涧水中鸣叫。',appre:'以动衬静，描绘了春夜山中的宁静。'},
  {title:'鹿柴',author:'王维',dynasty:'唐',tags:['风景','静谧','山林'],week:46,content:'空山不见人，但闻人语响。返景入深林，复照青苔上。',translation:'空旷的山中看不见人，只听到有人说话的声音。夕阳的余晖照进深林，又照在青苔上面。',appre:'描绘了山中傍晚的幽静景象。'},
  {title:'竹里馆',author:'王维',dynasty:'唐',tags:['隐居','自然','宁静'],week:47,content:'独坐幽篁里，弹琴复长啸。深林人不知，明月来相照。',translation:'独自坐在幽深的竹林里，一边弹琴一边长啸。深林中没有人知道，只有明月来照耀着我。',appre:'表现了隐居生活的宁静和淡泊。'},
  {title:'送元二使安西',author:'王维',dynasty:'唐',tags:['送别','友情','经典'],week:48,content:'渭城朝雨浥轻尘，客舍青青柳色新。劝君更尽一杯酒，西出阳关无故人。',translation:'渭城早晨的雨打湿了轻尘，客舍旁的柳树焕然一新。劝你再喝一杯酒，向西出了阳关就没有老朋友了。',appre:'著名的送别诗，情真意切。'},
  {title:'九月十日即事',author:'李白',dynasty:'唐',tags:['菊花','感叹'],week:49,content:'昨日登高罢，今朝更举觞。菊花何太苦，遭此两重阳。',translation:'昨天刚登高完毕，今天又要举杯。菊花为何这么苦，遭遇两次重阳。',appre:'借菊花表达感慨。'},
  {title:'独坐敬亭山',author:'李白',dynasty:'唐',tags:['孤独','山','风景'],week:50,content:'众鸟高飞尽，孤云独去闲。相看两不厌，只有敬亭山。',translation:'群鸟高飞远去不见了，一片孤云悠闲地飘走。互相看着不厌倦的，只有我和敬亭山。',appre:'表达了孤独寂寞又旷达的情怀。'}

/**
 * 核心系统：本地存储管理 + 猫咪宠物系统 + 激励机制
 */

const Store = {
  // 默认数据
  defaults: {
    cat: {
      name: '咪咪',
      stage: 0,       // 0=宝宝, 1=小, 2=大, 3=英雄
      exp: 0,
      mood: 'happy',  // happy, hungry, excited
      lastFeed: null,
    },
    foods: { fish: 0, milk: 0, cake: 0 },  // 食物库存
    stats: {
      totalTasks: 0,
      correctTasks: 0,
      streakDays: 0,
      lastCheckIn: null,
      checkInDates: [],  // 打卡日期
      learnedPoems: [],  // 已学古诗
      learnedHanzi: [],  // 已学汉字
      learnedWords: [],  // 已学单词
      todayTasks: {},    // 今日各科目完成情况 {chinese: true, math: true, ...}
      lastTaskDate: null,// 今日任务记录的日期
      allDoneRewarded: false, // 今日是否已领全勤蛋糕
    },
    wrongBook: [],   // 错题本
    memo: {          // 备忘录
      groups: [
        {id:'g1', name:'今日学习', items:[{id:'i1',text:'完成语文打卡',done:false},{id:'i2',text:'做10道算术题',done:false}]},
        {id:'g2', name:'习惯养成', items:[{id:'i3',text:'每天阅读15分钟',done:false}]},
      ]
    },
    progress: {
      hanziWeek: 1,       // 语文当前周
      poemWeek: 1,        // 古诗当前周
      phonicsIndex: 0,    // 自然拼读进度
      dailyIndex: 0,      // 每日拓展索引
    },
    gameScores: {
      match: 0,    // 对对碰
      goose: 0,    // 抓大鹅
    }
  },

  // 读取
  get(key) {
    const data = JSON.parse(localStorage.getItem('tongtong_data') || '{}');
    if (key) {
      return this._getDeep(data, key, this.defaults[key]);
    }
    return {...this.defaults, ...data};
  },

  _getDeep(obj, path, def) {
    const keys = path.split('.');
    let cur = obj;
    for (const k of keys) {
      if (cur[k] === undefined) return def;
      cur = cur[k];
    }
    return cur;
  },

  // 保存
  save(key, value) {
    const data = JSON.parse(localStorage.getItem('tongtong_data') || '{}');
    if (key.includes('.')) {
      const keys = key.split('.');
      let cur = data;
      for (let i = 0; i < keys.length - 1; i++) {
        if (!cur[keys[i]]) cur[keys[i]] = {};
        cur = cur[keys[i]];
      }
      cur[keys[keys.length - 1]] = value;
    } else {
      data[key] = value;
    }
    localStorage.setItem('tongtong_data', JSON.stringify(data));
  },

  // 重置
  reset() {
    localStorage.removeItem('tongtong_data');
  }
};

// ============ 猫咪宠物系统 ============
const CatSystem = {
  stages: [
    {name:'宝宝猫',emoji:'🐱',minExp:0,desc:'刚出生的小奶猫'},
    {name:'小猫咪',emoji:'😺',minExp:50,desc:'活泼的小猫咪'},
    {name:'大猫咪',emoji:'😸',minExp:150,desc:'强壮的大猫咪'},
    {name:'英雄猫',emoji:'🦁',minExp:300,desc:'传说中的猫咪英雄！'},
  ],
  foods: {
    fish: {emoji:'🐟',name:'小鱼干',exp:5,color:'#4fc3f7'},
    milk: {emoji:'🥛',name:'牛奶',exp:8,color:'#fff9c4'},
    cake: {emoji:'🍰',name:'蛋糕',exp:15,color:'#f8bbd0'},
  },

  // 获取猫咪状态
  getCat() {
    return Store.get('cat');
  },

  // 喂食
  feed(foodType) {
    const cat = Store.get('cat');
    const foods = Store.get('foods');
    if (foods[foodType] <= 0) {
      return {success:false, msg:'没有这个食物了，快去完成任务获得吧！'};
    }
    foods[foodType]--;
    Store.save('foods', foods);
    
    const food = this.foods[foodType];
    cat.exp += food.exp;
    cat.lastFeed = new Date().toISOString();
    cat.mood = 'excited';
    
    // 检查升级
    let leveledUp = false;
    let oldStage = cat.stage;
    for (let i = this.stages.length - 1; i >= 0; i--) {
      if (cat.exp >= this.stages[i].minExp) {
        cat.stage = i;
        if (i > oldStage) leveledUp = true;
        break;
      }
    }
    Store.save('cat', cat);
    
    return {
      success: true, 
      foodExp: food.exp, 
      newExp: cat.exp, 
      leveledUp, 
      newStage: cat.stage,
      stageInfo: this.stages[cat.stage]
    };
  },

  // 获得食物
  addFood(type, count=1) {
    const foods = Store.get('foods');
    foods[type] = (foods[type]||0) + count;
    Store.save('foods', foods);
  },

  // 获取当前阶段信息
  getStageInfo() {
    const cat = Store.get('cat');
    return this.stages[cat.stage];
  },

  // 获取升级进度
  getProgress() {
    const cat = Store.get('cat');
    const cur = this.stages[cat.stage];
    const next = this.stages[cat.stage + 1];
    if (!next) return {current:cur.exp, max:cur.minExp, percent:100, isMax:true};
    const range = next.minExp - cur.minExp;
    const progress = cat.exp - cur.minExp;
    return {current:cat.exp, max:next.minExp, percent:Math.round(progress/range*100), isMax:false};
  },

  // 6大科目定义（用于"今日全勤"判定）
  subjectTypes: ['chinese','math','thinking','english','poem','daily'],

  // 记录任务完成
  recordTask(correct, type) {
    const stats = Store.get('stats');
    stats.totalTasks++;
    if (correct) stats.correctTasks++;
    
    // 重置今日任务（跨天时）
    const today = new Date().toDateString();
    if (stats.lastTaskDate !== today) {
      stats.todayTasks = {};
      stats.allDoneRewarded = false;
      stats.lastTaskDate = today;
    }
    
    // 记录该科目今日已完成（归类到6大科目）
    const subject = this._mapSubject(type);
    if (correct && subject) {
      stats.todayTasks[subject] = true;
    }
    Store.save('stats', stats);
    
    // 答对奖励：随机小鱼干或牛奶
    let reward = null;
    if (correct) {
      reward = Math.random() < 0.5 ? 'fish' : 'milk';
      this.addFood(reward, 1);
    }
    
    // 检查今日所有科目是否全部完成
    const allDone = this._checkAllDone();
    if (allDone.justCompleted && !allDone.alreadyRewarded) {
      // 今日全部科目完成，奖励蛋糕！
      this.addFood('cake', 1);
      stats.allDoneRewarded = true;
      Store.save('stats', stats);
      return {correct, reward, cakeReward: true};
    }
    
    return {correct, reward, cakeReward: false};
  },

  // 把具体任务类型映射到6大科目
  _mapSubject(type) {
    const map = {
      // 语文
      chinese: 'chinese', pinyin: 'chinese', reading: 'chinese',
      // 算术
      math: 'math', breakten: 'math', maketen: 'math', word: 'math',
      // 思维
      thinking: 'thinking',
      // 英语
      english: 'english', sentence: 'english', spotdiff: 'english', phonics: 'english',
      // 古诗
      poem: 'poem',
      // 每日拓展
      knowledge: 'daily', experiment: 'daily', story: 'daily', nursery: 'daily', challenge: 'daily',
      // 游戏（不算正式科目，但也给奖励）
      matchgame: null, goosegame: null,
    };
    return map[type] !== undefined ? map[type] : null;
  },

  // 检查今日所有科目是否完成
  _checkAllDone() {
    const stats = Store.get('stats');
    const completed = this.subjectTypes.filter(s => stats.todayTasks[s]).length;
    const allDone = completed >= this.subjectTypes.length;
    return {
      allDone,
      completed,
      total: this.subjectTypes.length,
      justCompleted: allDone,
      alreadyRewarded: stats.allDoneRewarded,
    };
  },

  // 获取今日任务进度（供UI展示）
  getTodayProgress() {
    const stats = Store.get('stats');
    const today = new Date().toDateString();
    if (stats.lastTaskDate !== today) {
      return {completed: 0, total: this.subjectTypes.length, subjects: {}, allDone: false, rewarded: false};
    }
    const subjects = {};
    this.subjectTypes.forEach(s => { subjects[s] = !!stats.todayTasks[s]; });
    const completed = this.subjectTypes.filter(s => stats.todayTasks[s]).length;
    return {
      completed,
      total: this.subjectTypes.length,
      subjects,
      allDone: completed >= this.subjectTypes.length,
      rewarded: stats.allDoneRewarded,
    };
  },

  // 记录错题
  recordWrong(question, answer, correctAnswer, module) {
    const wrongBook = Store.get('wrongBook');
    wrongBook.push({
      id: Date.now() + Math.random(),
      question, answer, correctAnswer, module,
      date: new Date().toISOString(),
      mastered: false,
    });
    Store.save('wrongBook', wrongBook);
  },

  // 打卡
  checkIn() {
    const stats = Store.get('stats');
    const today = new Date().toDateString();
    
    if (stats.lastCheckIn === today) {
      return {alreadyChecked:true, streak:stats.streakDays};
    }
    
    // 检查是否连续
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    if (stats.lastCheckIn === yesterday) {
      stats.streakDays++;
    } else {
      stats.streakDays = 1;
    }
    
    stats.lastCheckIn = today;
    if (!stats.checkInDates.includes(today)) {
      stats.checkInDates.push(today);
    }
    Store.save('stats', stats);
    
    // 打卡奖励：小鱼干或牛奶
    this.addFood(Math.random() < 0.5 ? 'fish' : 'milk', 1);
    if (stats.streakDays % 7 === 0) {
      this.addFood('milk', 1);
    }
    
    return {alreadyChecked:false, streak:stats.streakDays, rewarded:true};
  },

  // 统一的任务奖励提示（各页面调用）
  showTaskReward(result) {
    if (!result || !result.correct) return;
    const foodNames = {fish:'小鱼干🐟', milk:'牛奶🥛', cake:'蛋糕🍰'};
    if (result.reward) {
      showToast(`🎉 答对了！获得${foodNames[result.reward]}`, 'success');
    }
    if (result.cakeReward) {
      vibrate(60);
      setTimeout(() => {
        showReward('cake');
        setTimeout(() => {
          showToast('🎊 太棒了！今日全部科目完成，奖励蛋糕🍰！', 'success');
        }, 800);
      }, 600);
    }
  }
};

// ============ 工具函数 ============
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

// 语音朗读
function speak(text, lang='zh-CN') {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.8;
    u.pitch = 1.2;
    speechSynthesis.speak(u);
  }
}

function speakEn(text) {
  speak(text, 'en-US');
}

// 打乱数组
function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}

// 随机取n个
function pickRandom(arr, n) {
  return shuffle([...arr]).slice(0, n);
}

// 震动反馈
function vibrate(ms=30) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

// 显示toast
function showToast(msg, type='info') {
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 2000);
}

// 显示奖励动画
function showReward(foodType) {
  const food = CatSystem.foods[foodType];
  const overlay = document.createElement('div');
  overlay.className = 'reward-overlay';
  overlay.innerHTML = `
    <div class="reward-bounce">
      <div class="reward-emoji">${food.emoji}</div>
      <div class="reward-text">+${food.exp} 经验！</div>
    </div>
  `;
  document.body.appendChild(overlay);
  setTimeout(() => overlay.classList.add('show'), 10);
  setTimeout(() => {
    overlay.classList.remove('show');
    setTimeout(() => overlay.remove(), 500);
  }, 1500);
}

// 食物飞向猫咪动画
function flyFoodToCat(foodType, callback) {
  const food = CatSystem.foods[foodType];
  const catEl = document.querySelector('.cat-display') || document.querySelector('.nav-cat');
  if (!catEl) { callback && callback(); return; }
  
  const catRect = catEl.getBoundingClientRect();
  const fly = document.createElement('div');
  fly.className = 'flying-food';
  fly.textContent = food.emoji;
  fly.style.position = 'fixed';
  fly.style.fontSize = '40px';
  fly.style.zIndex = '9999';
  fly.style.left = '50%';
  fly.style.top = '50%';
  fly.style.transition = 'all 0.8s cubic-bezier(0.5, -0.5, 0.5, 1.5)';
  document.body.appendChild(fly);
  
  requestAnimationFrame(() => {
    fly.style.left = (catRect.left + catRect.width/2) + 'px';
    fly.style.top = (catRect.top + catRect.height/2) + 'px';
    fly.style.transform = 'scale(0.3) rotate(360deg)';
    fly.style.opacity = '0';
  });
  
  setTimeout(() => {
    fly.remove();
    // 猫咪蹦跳
    catEl.classList.add('cat-bounce');
    setTimeout(() => catEl.classList.remove('cat-bounce'), 600);
    callback && callback();
  }, 800);
}

function formatDate(d) {
  const days = ['周日','周一','周二','周三','周四','周五','周六'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${days[d.getDay()]}`;
}

      ${progress.hanziWeek > 1 ? `<button class="btn btn-sm" onclick="changeHanziWeek(-1)">⬅️ 上一周</button>` : ''}

function speakHanzi(index) {
  const progress = Store.get('progress');
  const weekData = HANZI_DATA.find(w => w.week === progress.hanziWeek) || HANZI_DATA[0];
  const h = weekData.list[index];
  speak(`${h.zi}，${h.pinyin}，${h.word}，${h.phrase}`);
  vibrate(20);
}

function readAlong(index) {
  speakHanzi(index);
  showToast('🎤 请跟着读一遍吧~', 'info');
  // 跟读打卡也算完成
  const progress = Store.get('progress');
  const weekData = HANZI_DATA.find(w => w.week === progress.hanziWeek) || HANZI_DATA[0];
  const h = weekData.list[index];
  const learned = Store.get('stats').learnedHanzi;
  if (!learned.includes(h.zi)) {
    learned.push(h.zi);
    Store.save('stats.learnedHanzi', learned);
    const r = CatSystem.recordTask(true, 'chinese');
    CatSystem.showTaskReward(r);
  }
}

function markHanziLearned(index) {
  const progress = Store.get('progress');
  const weekData = HANZI_DATA.find(w => w.week === progress.hanziWeek) || HANZI_DATA[0];
  const h = weekData.list[index];
  const learned = Store.get('stats').learnedHanzi;
  if (learned.includes(h.zi)) {
    showToast('这个字已经学过啦~', 'info');
    return;
  }
  learned.push(h.zi);
  Store.save('stats.learnedHanzi', learned);
  const r = CatSystem.recordTask(true, 'chinese');
  CatSystem.showTaskReward(r);
  vibrate(30);
  renderHanzi();
}

function hanziNext() {
  const progress = Store.get('progress');
  const weekData = HANZI_DATA.find(w => w.week === progress.hanziWeek) || HANZI_DATA[0];
  hanziCarouselIndex = (hanziCarouselIndex + 1) % weekData.list.length;
  updateHanziCarousel();
}

function hanziPrev() {
  const progress = Store.get('progress');
  const weekData = HANZI_DATA.find(w => w.week === progress.hanziWeek) || HANZI_DATA[0];
  hanziCarouselIndex = (hanziCarouselIndex - 1 + weekData.list.length) % weekData.list.length;
  updateHanziCarousel();
}

function hanziGoto(i) {
  hanziCarouselIndex = i;
  updateHanziCarousel();
}

function updateHanziCarousel() {
  const track = $('#hanzi-track');
  if (track) {
    track.style.transform = `translateX(-${hanziCarouselIndex * 100}%)`;
    $$('#hanzi-dots .carousel-dot').forEach((d, i) => {
      d.classList.toggle('active', i === hanziCarouselIndex);
    });
  }
}

function changeHanziWeek(delta) {
  const progress = Store.get('progress');
  progress.hanziWeek += delta;
  if (progress.hanziWeek < 1) progress.hanziWeek = 1;
  if (progress.hanziWeek > HANZI_DATA.length) progress.hanziWeek = HANZI_DATA.length;
  Store.save('progress', progress);
  hanziCarouselIndex = 0;
  renderHanzi();
}

function answerReading(idx) {
  const item = READING_DATA[readingIndex];
  const q = item.questions[readingQIndex];
  const options = $$('#reading-quiz .quiz-option');
  options.forEach(o => o.onclick = null);
  
  if (idx === q.a) {
    options[idx].classList.add('correct');
    const r = CatSystem.recordTask(true, 'reading');
    CatSystem.showTaskReward(r);
    vibrate(30);
    setTimeout(() => {
      readingQIndex++;
      if (readingQIndex >= item.questions.length) {
        readingQIndex = 0;
        readingIndex = (readingIndex + 1) % READING_DATA.length;
        showToast('🎉 这篇读完了，下一篇！', 'success');
        renderReading();
      } else {
        renderReadingQuiz();
      }
    }, 1200);
  } else {
    options[idx].classList.add('wrong');
    options[q.a].classList.add('correct');
    CatSystem.recordTask(false, 'reading');
    CatSystem.recordWrong(q.q, q.options[idx], q.options[q.a], '阅读理解');
    showToast('❌ 再想想~', 'error');
    setTimeout(() => {
      readingQIndex++;
      if (readingQIndex >= item.questions.length) {
        readingQIndex = 0;
        readingIndex = (readingIndex + 1) % READING_DATA.length;
        renderReading();
      } else {
        renderReadingQuiz();
      }
    }, 2000);
  }
}

function newMathQuiz() {
  const type = Math.random() > 0.5 ? 'add' : 'sub';

function checkMathAnswer() {
  const input = $('#math-answer');
  const ans = parseInt(input.value);
  if (isNaN(ans)) {

  const fb = $('#math-feedback');

    fb.innerHTML = `<div class="method-tip" style="background:#c8e6c9;border-color:var(--success)">🎉 答对了！太棒了！</div>`;

        <button class="btn btn-success" onclick="checkBreakTen()">✅ 提交</button>
        <button class="btn btn-secondary" onclick="speak('${item.question.replace(/=/g,'等于').replace(/\?/g,'几')}')">🔊 读题</button>

    </div>
    <div class="card">
      <div class="card-title">📖 破十法小课堂</div>

        <p>步骤：</p>
        <p>1️⃣ 把十几分成 <b>10</b> 和 <b>几</b></p>
        <p>2️⃣ 用 <b>10</b> 去减减数</p>
        <p>3️⃣ 再把结果加上剩下的几</p>

function checkBreakTen() {

function speakEnSlow(text) {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.5;
    speechSynthesis.speak(u);
  }
}

function markWordLearned() {
  const w = ENGLISH_DATA.words[wordIndex];
  const learned = Store.get('stats').learnedWords;
  if (!learned.includes(w.en)) {
    learned.push(w.en);
    Store.save('stats.learnedWords', learned);
    const r = CatSystem.recordTask(true, 'english');
    CatSystem.showTaskReward(r);
    vibrate(30);
    renderWords();
  }
}

function wordNext() {
  wordIndex = (wordIndex + 1) % ENGLISH_DATA.words.length;
  renderWords();
}

function wordPrev() {
  wordIndex = (wordIndex - 1 + ENGLISH_DATA.words.length) % ENGLISH_DATA.words.length;
  renderWords();
}

function jumpToCategory(cat) {
  const idx = ENGLISH_DATA.words.findIndex(w => w.category === cat);
  if (idx >= 0) { wordIndex = idx; renderWords(); }
}

// ============ 找不同 ============
let diffIndex = 0;
let diffFound = [];
function renderSpotDiff() {
  const item = ENGLISH_DATA.spotDiff[diffIndex];
  diffFound = [];
  
  // 找出不同项
  const diffs = [];
  for (let i = 0; i < item.set1.length; i++) {
    if (item.set1[i] !== item.set2[i]) diffs.push(i);
  }
  
  $('#english-content').innerHTML = `
    <div class="card">
      <div class="card-title">🔍 找不同 ${diffIndex+1}/${ENGLISH_DATA.spotDiff.length}</div>
      <div style="font-size:13px;color:var(--text-light);margin-bottom:10px">找出两组图片中不同的地方！共${diffs.length}处不同</div>
      <div style="font-size:13px;color:var(--primary);margin-bottom:10px">已找到：<span id="diff-count">0</span>/${diffs.length}</div>
      
      <div style="font-size:14px;font-weight:600;margin-bottom:6px">第一组：</div>
      <div class="diff-set" id="diff-set1">
        ${item.set1.map((e, i) => `<div class="diff-item" data-idx="${i}" data-set="1" onclick="checkDiff(${i})">${e}</div>`).join('')}
      </div>
      
      <div style="font-size:14px;font-weight:600;margin:12px 0 6px">第二组：</div>
      <div class="diff-set" id="diff-set2">
        ${item.set2.map((e, i) => `<div class="diff-item" data-idx="${i}" data-set="2" onclick="checkDiff2(${i})">${e}</div>`).join('')}
      </div>
      
      <div id="diff-fb" style="margin-top:12px"></div>
    </div>
  `;
  
  // 存储正确答案
  window._diffs = diffs;
}

function checkDiff(idx) {
  doCheckDiff(idx, 1);
}

function checkDiff2(idx) {
  doCheckDiff(idx, 2);
}

function doCheckDiff(idx, setNum) {
  if (diffFound.includes(idx)) return;
  const diffs = window._diffs;
  
  if (diffs.includes(idx)) {
    diffFound.push(idx);
    // 标记两组对应位置
    $$(`#diff-set1 .diff-item`)[idx].classList.add('found');
    $$(`#diff-set2 .diff-item`)[idx].classList.add('found');
    $('#diff-count').textContent = diffFound.length;
    speakEn(ENGLISH_DATA.spotDiff[diffIndex][`set${setNum}`][idx].replace(/[^a-zA-Z]/g,''));
    
    if (diffFound.length >= diffs.length) {
      const r = CatSystem.recordTask(true, 'spotdiff');
      CatSystem.showTaskReward(r);
      $('#diff-fb').innerHTML = `<div class="method-tip" style="background:#c8e6c9;border-color:var(--success)">🎉 全部找到了！太棒了！</div>`;
      showToast('🎉 全部找到！', 'success');
      vibrate(30);
      setTimeout(() => {
        diffIndex = (diffIndex + 1) % ENGLISH_DATA.spotDiff.length;
        renderSpotDiff();
      }, 1500);
    }
  } else {
    showToast('这里没有不同哦~', 'info');
  }
}

/**
 * 古诗100首：译文、标签、朗读、搜索、每周一首进度
 */

let poemSearchQuery = '';
let poemFilterTag = '';

function renderPoems() {
  const progress = Store.get('progress');
  const learned = Store.get('stats').learnedPoems;
  const currentWeekPoem = ALL_POEMS.find(p => p.week === progress.poemWeek) || ALL_POEMS[0];
  
  // 获取所有标签
  const allTags = [...new Set(ALL_POEMS.flatMap(p => p.tags))];
  
  // 过滤
  let filtered = ALL_POEMS;
  if (poemSearchQuery) {
    filtered = filtered.filter(p => 
      p.title.includes(poemSearchQuery) || 
      p.author.includes(poemSearchQuery) ||
      p.content.includes(poemSearchQuery)
    );
  }
  if (poemFilterTag) {
    filtered = filtered.filter(p => p.tags.includes(poemFilterTag));
  }
  
  const html = `
    <div class="page-title">📜 古诗${ALL_POEMS.length}首</div>
    <div class="page-subtitle">每周一首 · 译文注释 · 语音朗读</div>
    
    <!-- 本周古诗 -->
    <div class="card">
      <div class="card-title">
        <span>⭐ 本周古诗（第${progress.poemWeek}周）</span>
        <span style="font-size:12px;color:var(--text-light)">已学${learned.length}首</span>
      </div>
      <div class="poem-card">
        <div class="poem-title">${currentWeekPoem.title}</div>
        <div class="poem-author">[${currentWeekPoem.dynasty}] ${currentWeekPoem.author}</div>
        <div class="poem-content">${currentWeekPoem.content}</div>
        <div style="margin-top:12px;display:flex;gap:8px;justify-content:center">
          <button class="btn btn-sm" onclick="speakPoem('${currentWeekPoem.title}','${currentWeekPoem.content}')">🔊 朗读</button>
          <button class="btn btn-sm btn-success" onclick="markPoemLearned(${currentWeekPoem.week})" ${learned.includes(currentWeekPoem.title)?'disabled':''}>${learned.includes(currentWeekPoem.title)?'✅ 已学':'✅ 学会了'}</button>
        </div>
        <div class="poem-tags">
          ${currentWeekPoem.tags.map(t => `<span class="poem-tag">${t}</span>`).join('')}
        </div>
      </div>
      <div class="poem-translation">
        <b>📝 译文：</b>${currentWeekPoem.translation}
      </div>
      <div class="poem-translation" style="margin-top:8px">
        <b>💡 赏析：</b>${currentWeekPoem.appre}
      </div>
    </div>
    
    <!-- 搜索和过滤 -->
    <div class="card">
      <div class="card-title">🔍 搜索古诗</div>
      <input type="text" class="search-box" placeholder="搜索标题、作者、诗句..." 
        value="${poemSearchQuery}" oninput="poemSearch(this.value)">
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
        <div class="tab ${!poemFilterTag?'active':''}" onclick="poemFilterByTag('')">全部</div>
        ${allTags.map(t => `<div class="tab ${poemFilterTag===t?'active':''}" onclick="poemFilterByTag('${t}')">${t}</div>`).join('')}
      </div>
      <div style="font-size:13px;color:var(--text-light)">共${filtered.length}首</div>
    </div>
    
    <!-- 古诗列表 -->
    <div class="card">
      <div class="card-title">📋 古诗列表</div>
      <div id="poem-list">
        ${filtered.length === 0 ? '<div class="empty-state"><div class="empty-state-icon">📜</div><div class="empty-state-text">没有找到相关古诗</div></div>' :
          filtered.map(p => `
            <div class="list-item" onclick="showPoemDetail(${ALL_POEMS.indexOf(p)})">
              <div class="list-item-icon">${learned.includes(p.title)?'✅' : '📜'}</div>
              <div class="list-item-content">
                <div class="list-item-title">${p.title}</div>
                <div class="list-item-desc">[${p.dynasty}] ${p.author} · ${p.content.substring(0,15)}...</div>
              </div>
              <div style="font-size:12px;color:var(--text-light)">第${p.week}周</div>
            </div>
          `).join('')
        }
      </div>
    </div>
  `;
  
  $('#page-poems').innerHTML = html;
}

function poemSearch(q) {
  poemSearchQuery = q;
  renderPoems();
  // 保持焦点
  setTimeout(() => {
    const input = $('.search-box');
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }, 0);
}

function poemFilterByTag(tag) {
  poemFilterTag = tag;
  renderPoems();
}

function markPoemLearned(week) {
  const poem = ALL_POEMS.find(p => p.week === week);
  if (!poem) return;
  const learned = Store.get('stats').learnedPoems;
  if (!learned.includes(poem.title)) {
    learned.push(poem.title);
    Store.save('stats.learnedPoems', learned);
    const r = CatSystem.recordTask(true, 'poem');
    CatSystem.showTaskReward(r);
    vibrate(30);
  }
  // 推进到下一周
  const progress = Store.get('progress');
  if (week === progress.poemWeek) {
    progress.poemWeek++;
    if (progress.poemWeek > ALL_POEMS.length) progress.poemWeek = ALL_POEMS.length;
    Store.save('progress', progress);
  }
  renderPoems();
}

function speakPoem(title, content) {
  speak(`${title}。${content}`);
}

function showPoemDetail(idx) {
  const p = ALL_POEMS[idx];
  const learned = Store.get('stats').learnedPoems;
  
  const modal = document.createElement('div');
  modal.className = 'reward-overlay';
  modal.style.cursor = 'pointer';
  modal.innerHTML = `
    <div style="background:white;border-radius:20px;padding:20px;max-width:90%;width:400px;max-height:80vh;overflow-y:auto;cursor:default" onclick="event.stopPropagation()">
      <div style="text-align:right;font-size:24px;cursor:pointer;color:var(--text-light)" onclick="this.closest('.reward-overlay').remove()">✕</div>
      <div class="poem-card">
        <div class="poem-title">${p.title}</div>
        <div class="poem-author">[${p.dynasty}] ${p.author}</div>
        <div class="poem-content">${p.content}</div>
        <div class="poem-tags">
          ${p.tags.map(t => `<span class="poem-tag">${t}</span>`).join('')}
        </div>
      </div>
      <div class="poem-translation">
        <b>📝 译文：</b>${p.translation}
      </div>
      <div class="poem-translation" style="margin-top:8px">
        <b>💡 赏析：</b>${p.appre}
      </div>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:center">
        <button class="btn" onclick="speakPoem('${p.title}','${p.content}')">🔊 朗读</button>
        <button class="btn btn-success" onclick="markPoemLearned(${p.week});this.closest('.reward-overlay').remove()" ${learned.includes(p.title)?'disabled':''}>${learned.includes(p.title)?'✅ 已学':'✅ 学会了'}</button>
      </div>
    </div>
  `;
  modal.onclick = () => modal.remove();
  document.body.appendChild(modal);
  setTimeout(() => modal.classList.add('show'), 10);
}

// ============ 拼音文字对对碰 ============
let matchState = {
  level: 1,
  score: 0,
  flipped: [],
  matched: [],
  pairs: [],
  cards: [],
  locked: false,
};

function renderMatchGame() {
  const scores = Store.get('gameScores');
  matchState.score = scores.match || 0;
  
  $('#game-content').innerHTML = `
    <div class="card">
      <div class="game-header">
        <div>
          <div style="font-size:16px;font-weight:700;color:var(--primary)">🎯 拼音文字对对碰</div>
          <div class="game-level">第 <span id="match-level">${matchState.level}</span> 关 · 配对拼音和汉字</div>
        </div>
        <div class="game-score">⭐ <span id="match-score">${matchState.score}</span></div>
      </div>
      <div style="font-size:13px;color:var(--text-light);margin-bottom:12px">
        翻开卡片，找到<b>拼音</b>和对应的<b>汉字</b>配对！
      </div>
      <div class="match-grid" id="match-grid"></div>
      <div id="match-fb" style="margin-top:12px;text-align:center"></div>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:center">
        <button class="btn btn-sm" onclick="startMatchGame()">🔄 重新开始</button>
        <button class="btn btn-sm btn-warning" onclick="nextMatchLevel()">⏭️ 下一关</button>
      </div>
    </div>
    <div class="card">
      <div style="font-size:13px;color:var(--text-light);text-align:center">
        🎮 玩法：点击两张卡片，拼音和汉字配对成功就消除！全部配对完成通关！
      </div>
    </div>
  `;
  startMatchGame();
}

function startMatchGame() {
  // 根据关卡选择汉字
  const pairsPerLevel = [4, 6, 8][Math.min(matchState.level - 1, 2)] || 8;
  const allHanzi = HANZI_DATA.flatMap(w => w.list);
  const selected = pickRandom(allHanzi, pairsPerLevel);
  
  matchState.pairs = selected.map(h => ({pinyin: h.pinyin, zi: h.zi, emoji: h.emoji}));
  matchState.cards = [];
  matchState.pairs.forEach((p, i) => {
    matchState.cards.push({id: i, type: 'pinyin', value: p.pinyin, display: p.pinyin});
    matchState.cards.push({id: i, type: 'zi', value: p.zi, display: p.zi});
  });
  matchState.cards = shuffle(matchState.cards);
  matchState.flipped = [];
  matchState.matched = [];
  matchState.locked = false;
  
  renderMatchGrid();
}

function renderMatchGrid() {
  const grid = $('#match-grid');
  if (!grid) return;
  grid.innerHTML = matchState.cards.map((card, idx) => {
    const isFlipped = matchState.flipped.includes(idx);
    const isMatched = matchState.matched.includes(card.id);
    return `
      <div class="match-card ${isFlipped||isMatched?'flipped':''} ${isMatched?'matched':''}" onclick="flipMatchCard(${idx})">
        <div class="card-back">${isMatched ? '✅' : '❓'}</div>
        <div class="card-front">${card.display}</div>
      </div>
    `;
  }).join('');
}

function flipMatchCard(idx) {
  if (matchState.locked) return;
  if (matchState.flipped.includes(idx)) return;
  if (matchState.matched.includes(matchState.cards[idx].id)) return;
  if (matchState.flipped.length >= 2) return;
  
  matchState.flipped.push(idx);
  renderMatchGrid();
  
  // 朗读
  speak(matchState.cards[idx].display);
  
  if (matchState.flipped.length === 2) {
    matchState.locked = true;
    setTimeout(checkMatch, 800);
  }
}

function checkMatch() {
  const [i1, i2] = matchState.flipped;
  const c1 = matchState.cards[i1];
  const c2 = matchState.cards[i2];
  
  if (c1.id === c2.id && c1.type !== c2.type) {
    // 配对成功
    matchState.matched.push(c1.id);
    matchState.score += 10;
    Store.save('gameScores.match', matchState.score);
    $('#match-score').textContent = matchState.score;
    showToast('🎉 配对成功！+10分', 'success');
    vibrate(30);
    
    matchState.flipped = [];
    matchState.locked = false;
    renderMatchGrid();
    
    // 检查通关
    if (matchState.matched.length === matchState.pairs.length) {
      const r = CatSystem.recordTask(true, 'matchgame');
      // 游戏通关固定奖励小鱼干
      CatSystem.addFood('fish', 1);
      $('#match-fb').innerHTML = `<div class="method-tip" style="background:#c8e6c9;border-color:var(--success)">🎉 通关了！太棒了！获得小鱼干🐟</div>`;
      setTimeout(() => {
        matchState.level++;
        $('#match-level').textContent = matchState.level;
        startMatchGame();
      }, 2000);
    }
  } else {
    // 配对失败
    showToast('❌ 不匹配，再试试~', 'error');
    matchState.flipped = [];
    matchState.locked = false;
    renderMatchGrid();
  }
}

function nextMatchLevel() {
  matchState.level++;
  $('#match-level').textContent = matchState.level;
  startMatchGame();
}

let gooseState = {

function renderGooseGame() {

function startGooseGame() {
  if (gooseState.running) return;
  gooseState.running = true;
  gooseState.caught = 0;
  gooseState.timeLeft = 30;
  
  // 设置目标单词
  setGooseTarget();
  
  // 倒计时
  if (gooseState.timer) clearInterval(gooseState.timer);
  gooseState.timer = setInterval(() => {
    gooseState.timeLeft--;
    const timeEl = $('#goose-time');
    if (timeEl) timeEl.textContent = gooseState.timeLeft;
    if (gooseState.timeLeft <= 0) {
      endGooseGame(false);
    }
  }, 1000);
  
  // 生成大鹅
  spawnGeese();
}

function setGooseTarget() {
  const word = pickRandom(ENGLISH_DATA.words, 1)[0];
  gooseState.target = word.en;
  gooseState.targetCn = word.cn;
  const tEl = $('#goose-target');
  if (tEl) {
    tEl.innerHTML = `找到这个单词：${word.cn} ${word.emoji}<br><span style="font-size:13px;color:var(--text-light)">点击对应的英文大鹅！</span>`;
  }
}

function spawnGeese() {
  if (!gooseState.running) return;
  const area = $('#goose-area');
  if (!area) return;
  
  area.innerHTML = '';
  
  // 生成5只大鹅，1只是正确的
  const correctWord = ENGLISH_DATA.words.find(w => w.en === gooseState.target);
  const otherWords = ENGLISH_DATA.words.filter(w => w.en !== gooseState.target);
  const wrongWords = pickRandom(otherWords, 4);
  const allWords = shuffle([correctWord, ...wrongWords]);
  
  allWords.forEach((w, i) => {
    const goose = document.createElement('div');
    goose.className = 'goose-cloud';
    goose.textContent = `🦢 ${w.en}`;
    goose.style.fontSize = '24px';
    goose.style.fontWeight = '700';
    goose.style.background = 'white';
    goose.style.padding = '8px 12px';
    goose.style.borderRadius = '20px';
    goose.style.boxShadow = '0 2px 8px rgba(0,0,0,0.2)';
    
    // 随机位置
    const x = Math.random() * 70 + 5;
    const y = Math.random() * 60 + 10;
    goose.style.left = x + '%';
    goose.style.top = y + '%';
    
    goose.onclick = () => catchGoose(goose, w.en);
    
    // 飘动动画
    let dx = (Math.random() - 0.5) * 2;
    let dy = (Math.random() - 0.5) * 2;
    let curX = x, curY = y;
    const moveInterval = setInterval(() => {
      if (!gooseState.running || !goose.parentNode) {
        clearInterval(moveInterval);
        return;
      }
      curX += dx * 0.5;
      curY += dy * 0.5;
      if (curX < 2 || curX > 85) dx = -dx;
      if (curY < 5 || curY > 75) dy = -dy;
      goose.style.left = curX + '%';
      goose.style.top = curY + '%';
    }, 200);
    
    area.appendChild(goose);
  });
}

function catchGoose(gooseEl, word) {
  if (!gooseState.running) return;
  
  if (word === gooseState.target) {
    // 抓对了
    gooseEl.classList.add('caught');
    gooseState.caught++;
    gooseState.score += 20;
    Store.save('gameScores.goose', gooseState.score);
    $('#goose-score').textContent = gooseState.score;
    $('#goose-caught').textContent = gooseState.caught;
    speakEn(word);
    showToast(`🎉 对了！${word}`, 'success');
    vibrate(30);
    
    setTimeout(() => gooseEl.remove(), 500);
    
    if (gooseState.caught >= gooseState.needed) {
      endGooseGame(true);
    } else {
      // 换一个目标
      setTimeout(() => {
        setGooseTarget();
        spawnGeese();
      }, 600);
    }
  } else {
    // 抓错了
    showToast(`❌ 这是 ${word}，不是 ${gooseState.target}`, 'error');
    gooseState.score = Math.max(0, gooseState.score - 5);
    Store.save('gameScores.goose', gooseState.score);
    $('#goose-score').textContent = gooseState.score;
    speakEn(word);
  }
}

function endGooseGame(win) {
  gooseState.running = false;
  if (gooseState.timer) clearInterval(gooseState.timer);
  
  const area = $('#goose-area');
  if (area) {
    area.innerHTML = `
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:white">
        <div style="font-size:60px">${win?'🏆':'⏰'}</div>
        <div style="font-size:20px;font-weight:700">${win?'通关了！':'时间到！'}</div>
        <div style="margin-top:8px">抓到 ${gooseState.caught} 只大鹅</div>
      </div>
    `;
  }
  
  if (win) {
    CatSystem.recordTask(true, 'goosegame');
    CatSystem.addFood('fish', 1);
    showToast('🎉 通关！获得小鱼干🐟', 'success');
    $('#goose-fb').innerHTML = `<div class="method-tip" style="background:#c8e6c9;border-color:var(--success)">🎉 太棒了！获得小鱼干奖励！</div>`;
    gooseState.level++;
  } else {
    $('#goose-fb').innerHTML = `<div class="method-tip" style="background:#fff9c4;border-color:var(--accent)">⏰ 时间到！再来一次吧~</div>`;
  }
}

function stopGooseGame() {
  endGooseGame(false);
}

              <div class="memo-checkbox ${item.done?'checked':''}" onclick="toggleMemoItem('${g.id}','${item.id}')"></div>
              <div class="memo-text ${item.done?'done':''}">${item.text}</div>
              <span class="memo-delete" onclick="deleteMemoItem('${g.id}','${item.id}')">✕</span>
            </div>
          `).join('')}
          <div style="display:flex;gap:8px;margin-top:8px">
            <input type="text" class="memo-add-input" id="new-item-${g.id}" placeholder="添加新任务..." 
              onkeypress="if(event.key==='Enter')addMemoItem('${g.id}')">
            <button class="btn btn-sm" onclick="addMemoItem('${g.id}')">添加</button>
          </div>
        </div>
      `;
    }).join('')}
  `;
  
  $('#page-memo').innerHTML = html;
}

function addMemoGroup() {
  const name = $('#new-group-name').value.trim();
  if (!name) { showToast('请输入分组名称','warning'); return; }
  const memo = Store.get('memo');
  memo.groups.push({id: 'g' + Date.now(), name, items: []});
  Store.save('memo', memo);
  renderMemo();
}

function deleteMemoGroup(gid) {
  if (!confirm('确定删除这个分组吗？')) return;
  const memo = Store.get('memo');
  memo.groups = memo.groups.filter(g => g.id !== gid);
  Store.save('memo', memo);
  renderMemo();
}

function addMemoItem(gid) {
  const input = $(`#new-item-${gid}`);
  const text = input.value.trim();
  if (!text) return;
  const memo = Store.get('memo');
  const group = memo.groups.find(g => g.id === gid);
  if (group) {
    group.items.push({id: 'i' + Date.now(), text, done: false});
    Store.save('memo', memo);
    renderMemo();
  }
}

function toggleMemoItem(gid, iid) {
  const memo = Store.get('memo');
  const group = memo.groups.find(g => g.id === gid);
  if (group) {
    const item = group.items.find(i => i.id === iid);
    if (item) {
      item.done = !item.done;
      Store.save('memo', memo);
      renderMemo();
    }
  }
}

function deleteMemoItem(gid, iid) {
  const memo = Store.get('memo');
  const group = memo.groups.find(g => g.id === gid);
  if (group) {
    group.items = group.items.filter(i => i.id !== iid);
    Store.save('memo', memo);
    renderMemo();
  }
}

/**
 * 主应用入口：页面切换 + 初始化
 */

// 视口自适应：保证在小视口下也完整显示
function applyViewportScale() {
  const MOBILE_WIDTH = 375;  // iPhone 基准
  const nav = document.querySelector('.navbar');
  const main = document.querySelector('.main');
  if (!main || !nav) return;
  
  const navWidth = nav.offsetWidth;
  const viewportWidth = window.innerWidth;
  const availableWidth = viewportWidth - navWidth;
  
  // 视口 < 移动端基准 时，按比例缩小
  if (viewportWidth < MOBILE_WIDTH) {
    const scale = availableWidth / (MOBILE_WIDTH - navWidth);
    main.style.transformOrigin = 'top left';
    main.style.transform = `scale(${scale})`;
    main.style.paddingBottom = (100 * scale) + 'px';
  } else {
    main.style.transform = '';
    main.style.paddingBottom = '';
  }
}

// 页面切换
function switchPage(page) {
  // 切换导航高亮
  $$('.nav-item').forEach(item => {
    item.classList.toggle('active', item.dataset.page === page);
  });
  
  // 切换页面显示
  $$('.page').forEach(p => p.classList.remove('active'));
  const target = $(`#page-${page}`);
  if (target) target.classList.add('active');
  
  // 渲染对应页面
  switch (page) {
    case 'home': renderHome(); break;
    case 'chinese': renderChinese(); break;
    case 'math': renderMath(); break;
    case 'thinking': renderThinking(); break;
    case 'english': renderEnglish(); break;
    case 'poems': renderPoems(); break;
    case 'daily': renderDaily(); break;
    case 'games': renderGames(); break;
    case 'wrongbook': renderWrongBook(); break;
    case 'memo': renderMemo(); break;
    case 'reward': renderReward(); break;
  }
  
  // 滚动到顶部
  window.scrollTo(0, 0);
  
  // 切换页面后重新计算缩放（内容高度可能变化）
  setTimeout(applyViewportScale, 50);
}

// 初始化
function init() {
  // 首次访问检查打卡
  CatSystem.checkIn();
  renderHome();
  // 视口缩放
  applyViewportScale();
  window.addEventListener('resize', applyViewportScale);
  // 切换页面后也调用一次（防止内容变化影响高度）
  setTimeout(applyViewportScale, 100);
}

// DOM加载完成
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}


</script>
