<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
  <title>彤彤学习工作台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 左侧导航栏 -->
  <nav class="navbar">
    <div class="nav-cat" onclick="switchPage('home')">🐱</div>
    <div class="nav-item active" data-page="home" onclick="switchPage('home')">
      <div class="nav-icon">🏠</div><div>首页</div>
    </div>
    <div class="nav-item" data-page="chinese" onclick="switchPage('chinese')">
      <div class="nav-icon">📚</div><div>语文</div>
    </div>
    <div class="nav-item" data-page="math" onclick="switchPage('math')">
      <div class="nav-icon">🔢</div><div>算术</div>
    </div>
    <div class="nav-item" data-page="thinking" onclick="switchPage('thinking')">
      <div class="nav-icon">🧩</div><div>思维</div>
    </div>
    <div class="nav-item" data-page="english" onclick="switchPage('english')">
      <div class="nav-icon">🔤</div><div>英语</div>
    </div>
    <div class="nav-item" data-page="poems" onclick="switchPage('poems')">
      <div class="nav-icon">📜</div><div>古诗</div>
    </div>
    <div class="nav-item" data-page="daily" onclick="switchPage('daily')">
      <div class="nav-icon">🌟</div><div>拓展</div>
    </div>
    <div class="nav-item" data-page="games" onclick="switchPage('games')">
      <div class="nav-icon">🎮</div><div>游戏</div>
    </div>
    <div class="nav-item" data-page="wrongbook" onclick="switchPage('wrongbook')">
      <div class="nav-icon">📕</div><div>错题</div>
    </div>
    <div class="nav-item" data-page="memo" onclick="switchPage('memo')">
      <div class="nav-icon">📝</div><div>备忘</div>
    </div>
    <div class="nav-item" data-page="reward" onclick="switchPage('reward')">
      <div class="nav-icon">🎁</div><div>奖励</div>
    </div>
  </nav>

  <!-- 主内容区 -->
  <main class="main">
    <div id="page-home" class="page active"></div>
    <div id="page-chinese" class="page"></div>
    <div id="page-math" class="page"></div>
    <div id="page-thinking" class="page"></div>
    <div id="page-english" class="page"></div>
    <div id="page-poems" class="page"></div>
    <div id="page-daily" class="page"></div>
    <div id="page-games" class="page"></div>
    <div id="page-wrongbook" class="page"></div>
    <div id="page-memo" class="page"></div>
    <div id="page-reward" class="page"></div>
  </main>

  <script src="js/data-chinese.js"></script>
  <script src="js/data-other.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pages-home.js"></script>
  <script src="js/pages-chinese.js"></script>
  <script src="js/pages-math.js"></script>
  <script src="js/pages-thinking.js"></script>
  <script src="js/pages-english.js"></script>
  <script src="js/pages-poems.js"></script>
  <script src="js/pages-daily.js"></script>
  <script src="js/pages-games.js"></script>
  <script src="js/pages-aux.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
